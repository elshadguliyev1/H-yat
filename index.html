<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Həyat, sən nə qəribəsən</title>
<meta name="description" content="Mətn əsaslı həyat simulyatoru: 5 yaşdan qocalığa qədər seçimlər, peşələr, ailə və xəyali sosial şəbəkə.">
<meta name="theme-color" content="#f6efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Həyat">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root {
  --bg: #f6efe6; --surface: #fffaf4; --surface-2: #efe5d8; --line: #e3d6c5;
  --fg: #2a1f17; --muted: #7b6a5b; --accent: #e2553b; --accent-ink: #fff; --accent-soft: #fbe1d9;
  --good: #2f9e5a; --bad: #d23f31; --gold: #c58a12; --blue: #3b6fd8; --pink: #d94f8b;
  --shadow: 0 1px 2px rgba(60,30,10,.06), 0 6px 18px rgba(60,30,10,.07);
  --f-display: "Fraunces", Georgia, serif; --f-body: "Nunito", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16120f; --surface: #201a16; --surface-2: #2b241e; --line: #3a3029;
  --fg: #f4ebe1; --muted: #b1a090; --accent: #ff7656; --accent-ink: #1b0d08; --accent-soft: #3e2219;
  --good: #5fcf88; --bad: #ff7466; --gold: #f0b94a; --blue: #7ea4f5; --pink: #f285b3;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16120f; --surface: #201a16; --surface-2: #2b241e; --line: #3a3029;
  --fg: #f4ebe1; --muted: #b1a090; --accent: #ff7656; --accent-ink: #1b0d08; --accent-soft: #3e2219;
  --good: #5fcf88; --bad: #ff7466; --gold: #f0b94a; --blue: #7ea4f5; --pink: #f285b3;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 600 15.5px/1.45 var(--f-body); min-height: 100dvh }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)) }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; margin: 0; letter-spacing: -.01em; text-wrap: balance }
.muted { color: var(--muted) }
.small { font-size: 13px }
.btn { border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 800; background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000) }
.btn:active { transform: translateY(2px); box-shadow: none }
.btn.ghost { background: var(--surface); color: var(--fg); border: 2px solid var(--line); box-shadow: none }
.btn:disabled { opacity: .45; cursor: default; transform: none }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow) }

/* ---- start ---- */
#start { min-height: 100dvh; display: grid; place-items: center; padding-block: calc(24px + env(safe-area-inset-top)) 24px }
.logo { text-align: center }
.logo .sun { font-size: 64px; display: block; animation: bob 3s ease-in-out infinite }
.logo h1 { font-size: clamp(30px, 8vw, 44px); line-height: 1.05; margin-top: 8px }
.logo h1 em { color: var(--accent); font-style: italic }
.logo p { margin: 10px auto 0; max-width: 30ch }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg) } }
@media (prefers-reduced-motion: reduce) { .logo .sun { animation: none } }
.start-btns { display: grid; gap: 10px; margin-top: 26px }
.lives { margin-top: 22px }
.life-row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px }
.life-row:last-child { border-bottom: 0 }
.life-row .e { font-size: 24px }

/* ---- create ---- */
.form { display: grid; gap: 16px; padding-block: calc(18px + env(safe-area-inset-top)) 40px }
.form label.h { display: block; font-weight: 800; margin-bottom: 6px }
.form input[type=text], .form select { width: 100%; border: 2px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 14px; padding: 12px 14px; font: 700 16px var(--f-body) }
.toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.toggle button, .dreams button { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; font-weight: 800 }
.toggle button[aria-pressed="true"], .dreams button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.dreams { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
.bdate { display: grid; grid-template-columns: 1fr 1.6fr 1.2fr; gap: 8px }
.dreams button { display: grid; gap: 2px; justify-items: center; padding: 10px 4px; font-size: 12.5px }
.dreams button span { font-size: 26px }

/* ---- game ---- */
#game { padding-bottom: calc(96px + env(safe-area-inset-bottom)) }
.top { padding-top: calc(12px + env(safe-area-inset-top)); padding-bottom: 8px; display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; gap: 10px; align-items: center }
.help { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-weight: 800; font-size: 16px; display: grid; place-items: center; padding: 0 }
.legend { display: grid; gap: 8px; margin: 0 0 14px }
.legend div { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; font-size: 14px }
.legend b { display: block } .legend span.e { font-size: 22px; text-align: center }
.legend small { color: var(--muted); font-weight: 600 }
.ava { width: 58px; height: 58px; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); display: grid; place-items: center; font-size: 34px; box-shadow: var(--shadow) }
.who h2 { font-size: 20px; line-height: 1.15 }
.who .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.money { text-align: right; font-weight: 800; font-size: 15px; white-space: nowrap }
.money small { display: block; color: var(--muted); font-weight: 700; font-size: 11.5px }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 6px 0 12px }
.stat { display: grid; grid-template-columns: 22px minmax(0,1fr) 30px; gap: 6px; align-items: center; font-size: 12.5px }
.stat .bar { height: 9px; border-radius: 99px; background: var(--surface-2); overflow: hidden }
.stat .bar i { display: block; height: 100%; border-radius: 99px; transition: width .4s }
.stat .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted) }
nav.tabs { position: sticky; top: 0; z-index: 4; background: var(--bg); padding-top: env(safe-area-inset-top); border-bottom: 1px solid var(--line) }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-block: 6px }
nav.tabs button { flex: 1 0 auto; border: 0; background: none; padding: 8px 10px; border-radius: 12px; color: var(--muted); font-weight: 800; font-size: 13.5px; white-space: nowrap }
nav.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg) }
.panel { padding-top: 12px }
.yr { margin-bottom: 14px }
.yr h3 { font-family: var(--f-body); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 6px }
.yr p { margin: 0 0 6px; padding: 9px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-weight: 600 }
.agebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: linear-gradient(transparent, var(--bg) 30%); padding: 18px 0 calc(12px + env(safe-area-inset-bottom)) }
.agebar .wrap { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center }
.agebar .btn { font-size: 18px; padding: 15px; font-family: var(--f-display) }
.energy { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); font-weight: 800 }
.energy i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); display: inline-block }
.energy i.off { background: var(--surface-2); border: 2px solid var(--line) }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.act { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 8px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; font-weight: 700; font-size: 13.5px; line-height: 1.25; box-shadow: var(--shadow) }
.act span.i { font-size: 24px; text-align: center }
.act small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 700 }
.act:disabled { opacity: .45; cursor: default }
.sec-h { font-family: var(--f-body); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 8px }
.ppl { display: grid; gap: 8px }
.pp { display: grid; grid-template-columns: 42px minmax(0,1fr) auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; text-align: left; width: 100% }
.pp .e { font-size: 28px; text-align: center }
.pp .nm { font-weight: 800 }
.pp .rl { font-size: 12.5px; color: var(--muted) }
.pp .relbar { width: 70px; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden }
.pp .relbar i { display: block; height: 100%; background: var(--pink) }
.pp.dead { opacity: .55 }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px }
.kv dt { color: var(--muted) } .kv dd { margin: 0; font-weight: 800 }
.tal { display: grid; gap: 6px }
.tal div { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; font-size: 13px }
.stars { letter-spacing: 2px; color: var(--gold) }
.tbar { display: block; height: 9px; border-radius: 99px; background: var(--surface-2); overflow: hidden }
.tbar i { display: block; height: 100%; border-radius: 99px; background: var(--accent) }
/* social */
.prof { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center }
.prof .pic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 36px; background: linear-gradient(135deg, #ff9a7a, #d94f8b, #7c5cff); }
.prof .h { font-weight: 800 } .prof .h b { color: var(--blue) }
.prof .nums { display: flex; gap: 16px; font-size: 13px; color: var(--muted) } .prof .nums b { color: var(--fg); font-size: 16px }
.post { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px }
.post .ph { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted) }
.post .ph b { color: var(--fg) }
.post .tx { font-size: 16px; margin: 8px 0; font-weight: 700 }
.post .img { font-size: 54px; text-align: center; background: var(--surface-2); border-radius: 12px; padding: 14px 0; margin-bottom: 8px }
.post .meta { display: flex; gap: 14px; font-size: 13px; color: var(--muted); font-weight: 800 }
.post .cm { font-size: 13px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line) }
.post .cm p { margin: 3px 0 } .post .cm b { font-weight: 800 } .post .cm .neg { color: var(--bad) }
.post .ex { font-size: 13px; margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: var(--accent-soft) }
.feed-it { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px } .feed-it:last-child { border: 0 }
/* modal */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(20,10,5,.55); display: grid; align-items: end; justify-items: center; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)) }
.sheet { width: 100%; max-width: 560px; max-height: calc(100dvh - 24px - env(safe-area-inset-top)); overflow: auto; background: var(--surface); border-radius: 24px; padding: 20px 18px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.35); animation: up .25s ease-out }
@keyframes up { from { transform: translateY(30px); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none } }
.sheet .big { font-size: 56px; text-align: center; line-height: 1 }
.sheet .age-tag { text-align: center; font-size: 12px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; margin: 8px 0 4px }
.sheet .q { font: 600 19px/1.4 var(--f-display); text-align: center; margin: 4px 0 16px; text-wrap: pretty }
.choices { display: grid; gap: 8px }
.choices button { text-align: left; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 13px 14px; font-weight: 800 }
.choices button:hover { border-color: var(--accent) }
.fx { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: -6px 0 16px }
.fx span { font-size: 12.5px; font-weight: 800; border-radius: 99px; padding: 4px 10px; background: var(--surface-2) }
.fx .up { color: var(--good) } .fx .dn { color: var(--bad) }
.sheet .close { width: 100%; margin-top: 10px }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 30; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 800; max-width: calc(100% - 32px); text-align: center }
.end { text-align: center }
.end .big { font-size: 64px }
.end h2 { font-size: 26px; margin: 8px 0 4px }
.end .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin: 18px 0; text-align: center }
.end .vs div { background: var(--surface-2); border-radius: 14px; padding: 12px 8px; font-weight: 800 }
.end .vs small { display: block; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em }
.end .motto { font: italic 800 22px var(--f-display); color: var(--accent); margin: 8px 0 16px }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: left; margin-bottom: 16px }
.grid2 div { background: var(--surface-2); border-radius: 12px; padding: 10px }
.grid2 b { display: block; font-size: 18px }
@media (max-width: 380px) { .dreams { grid-template-columns: repeat(2, 1fr) } .acts { grid-template-columns: 1fr } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>
<script src="js/core.js"></script>
<script src="js/db.js"></script>
<script src="engine.js"></script>
<script src="js/career.js"></script>
<script src="js/justice.js"></script>
<script src="js/interp.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = $("#app");
let tab = "life";
function toast(t, ms = 2400) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, ms); }

// ---------- avatar ----------
const JOB_AVA = { pilot: ["👨‍✈️", "👩‍✈️"], herbi_pilot: ["👨‍✈️", "👩‍✈️"], herbci: ["💂", "💂‍♀️"], xilasedici: ["🧑‍🚒", "🧑‍🚒"], cerrah: ["👨‍⚕️", "👩‍⚕️"], alim: ["👨‍🔬", "👩‍🔬"], mesqci: ["🧢", "🧢"], usta: ["👨‍🔧", "👩‍🔧"], fehle: ["👷", "👷‍♀️"], polis: ["👮‍♂️", "👮‍♀️"], hekim: ["👨‍⚕️", "👩‍⚕️"], mugenni: ["👨‍🎤", "👩‍🎤"], muellim: ["👨‍🏫", "👩‍🏫"], proqramci: ["👨‍💻", "👩‍💻"], biznes: ["👨‍💼", "👩‍💼"], futbolcu: ["⚽", "⚽"], aktyor: ["🎭", "🎭"] };
function avatar(p = P) {
  if (!p.alive && p === P) return "🕊️";
  const k = p.g === "k";
  if (p === P && P.job && JOB_AVA[P.job.id] && p.age < 65) return JOB_AVA[P.job.id][k ? 0 : 1];
  if (p === P && inPrison()) return "🔒";
  if (p === P && P.army && !P.army.done) return "💂";
  if (p.age < 3) return "👶"; if (p.age < 13) return k ? "👦" : "👧"; if (p.age < 18) return k ? "🧑" : "👧";
  if (p.age < 40) return k ? "👨" : "👩"; if (p.age < 65) return k ? "🧔" : "👩‍🦱"; return k ? "👴" : "👵";
}
const ROLE_ICON = { "nənə": "👵", baba: "👴", ana: "👩", ata: "👨", "qardaş": "👦", "bacı": "👧", dost: "🤝", sevgili: "💕", "həyat yoldaşı": "💍", "uşaq": "🧒", "müəllim": "🧑‍🏫", "məşqçi": "🧢", "nəvə": "👶", "tanış": "🙂" };

// ---------- start ----------
const MAX_SLOTS = 5;
async function renderStart() {
  const all = await DB.listLives();
  const active = all.filter(l => l.alive);
  const arch = await DB.listArchive();
  app.innerHTML = `<section id="start" class="wrap"><div style="width:100%">
    <div class="logo"><span class="sun" aria-hidden="true">🌻</span><h1>Həyat, sən<br><em>nə qəribəsən</em></h1>
    <p class="muted">5 yaşından başla. Xəyal qur. Seçim et. Həyat isə öz bildiyini edəcək.</p></div>
    <div class="start-btns">
      ${active.map(l => `<button class="btn ${l === active[0] ? "" : "ghost"}" data-id="${esc(l.id)}">${l.g === "k" ? "👦" : "👧"} Davam et · ${esc(l.name)}, ${l.age} yaş</button>`).join("")}
      <button class="btn ${active.length ? "ghost" : ""}" id="new">+ Yeni həyat başlat</button>
    </div>
    ${active.length >= MAX_SLOTS ? `<p class="small muted" style="text-align:center">Eyni anda ən çox ${MAX_SLOTS} həyat saxlanılır.</p>` : ""}
    ${arch.length ? `<div class="card lives"><h3 style="font-size:16px;margin-bottom:6px">Tamamlanmış həyatlar</h3>${arch.slice(0, 10).map(l => `<div class="life-row"><span class="e">${l.g === "k" ? "👴" : "👵"}</span><div><b>${esc(l.name)}</b> · ${l.age} yaş<br><span class="muted">Xəyal: ${esc(l.dream || "?")} → Oldu: ${esc(l.became)}</span></div></div>`).join("")}</div>` : ""}
    ${DB.usingFallback ? `<p class="small muted" style="text-align:center">Brauzer verilənlər bazasına icazə vermədi: yaddaş məhdud rejimdədir.</p>` : ""}
  </div></section>`;
  app.querySelectorAll("[data-id]").forEach(b => b.onclick = async () => { await loadLife(b.dataset.id); DB.setMeta("active", P.id); tab = "life"; renderGame(); });
  $("#new").onclick = async () => {
    if (active.length >= MAX_SLOTS) { const old = active[active.length - 1]; if (!confirm(`Yer yoxdur. Ən köhnə həyat (${old.name}, ${old.age} yaş) silinsin?`)) return; await DB.deleteLife(old.id); }
    renderCreate();
  };
}

function renderCreate() {
  let g = "k", dream = null;
  app.innerHTML = `<section class="wrap form">
    <button class="btn ghost" id="back" style="justify-self:start;padding:8px 14px">← Geri</button>
    <h2 style="font-size:28px">Yeni həyat</h2>
    <div><label class="h" for="nm">Adı</label><input type="text" id="nm" maxlength="20" placeholder="Məs. Murad" autocomplete="off"></div>
    <div><span class="h" style="font-weight:800;display:block;margin-bottom:6px">Cinsi</span><div class="toggle" id="gen"><button data-g="k" aria-pressed="true">👦 Oğlan</button><button data-g="q" aria-pressed="false">👧 Qız</button></div></div>
    <div><span class="h" style="font-weight:800;display:block;margin-bottom:6px">Doğum tarixi</span>
      <div class="bdate"><select id="bd" aria-label="Gün">${Array.from({ length: 31 }, (_, i) => `<option>${i + 1}</option>`).join("")}</select>
      <select id="bm" aria-label="Ay">${Cal.MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join("")}</select>
      <select id="by" aria-label="İl">${Array.from({ length: BIRTH_YEAR_MAX - BIRTH_YEAR_MIN + 1 }, (_, i) => BIRTH_YEAR_MAX - i).map(y => `<option>${y}</option>`).join("")}</select></div>
      <p class="small muted" style="margin:6px 0 0">Oyun 5 yaşından başlayır. Ən gec doğum ili: ${BIRTH_YEAR_MAX}.</p></div>

// ---------- events ----------
function fxChips(changes) {
  return changes.filter(([k, d]) => d).map(([k, d]) => { const v = k === "money" ? fmtMoney(d) : k === "followers" ? (d > 0 ? "+" : "") + fmtNum(d) : (d > 0 ? "+" : "") + d; return `<span class="${d > 0 ? "up" : "dn"}">${STAT_ICONS[k]} ${k === "money" && d > 0 ? "+" : ""}${v}</span>`; }).join("");
}
function sheet(html) {

}
function showNextEvent() {

  P.day = Math.max(P.day, ev.day); // the calendar moves to the event's date (never backwards)
  const text = Interp.text(e.t);
  const choices = Interp.choicesOf(e);
  const s = sheet(`<div class="big" aria-hidden="true">${e.icon || "✨"}</div><div class="age-tag">${Cal.fmtMonth(P.day)} · ${P.age} yaş</div><p class="q">${esc(text)}</p><div class="choices">${choices.map((c, i) => `<button data-i="${i}">${esc(Interp.text(c.t))}</button>`).join("")}</div>`);
  s.el.querySelectorAll(".choices button").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, c = choices[i];
    P.seen[e.id] = P.age; P.yearEvents.shift();
    const res = Interp.choose(e, c);
    recordChoice(e.id, i, res.outcome, res.text);
    if (res.text) log(`${e.icon || "•"} ${res.text}`);
    save();
    const showResult = () => { s.el.innerHTML = `<div class="big" aria-hidden="true">${e.icon || "✨"}</div><p class="q">${esc(res.text || "Həyat davam edir.")}</p><div class="fx">${fxChips(res.changes)}</div><button class="btn close" id="ok">${P.yearEvents.length ? "Növbəti →" : "Davam"}</button>`;

    if (P.pendingName) nameForm(s.el, (old, name) => { if (old) res.text = res.text.split(old).join(name); showResult(); });
    else showResult();
  });
}

  const s = sheet(`<div class="big">🔎</div><p class="q">Hansı işə müraciət edirsən?</p>
    ${P.job ? `<p class="small muted" style="text-align:center;margin-top:-8px">İndiki işin: ${esc(jobTitle())}</p>` : ""}
    <div class="choices">${opts.map(o => { const c = CAREERS[o.id], b = c.sal[Math.min(o.lv, c.sal.length - 1)]; return `<button data-id="${o.id}">${c.icon} ${c.lv[o.lv]} · ${b[1] ? fmtMoney(b[0]) + "–" + fmtMoney(b[1]) + "/ay" : "gəlir dəyişkəndir"} <span class="muted small">· şans ${Math.round(clamp(o.odds * 100, 5, 95))}%</span></button>`; }).join("") || '<p class="muted">Hələ uyğun iş yoxdur.</p>'}

    <button class="btn ghost close">Bağla</button>`);

  s.el.querySelectorAll(".choices button").forEach(b => b.onclick = () => {
    if (!useAct()) return;

    else { const o = opts.find(x => x.id === b.dataset.id); if (chance(clamp(o.odds, .05, .95))) { startJob(o.id, o.lv); text = `Təbriklər! İşə götürüldün: ${jobTitle()} — ${P.job.employer}, ${fmtMoney(P.job.sal)}/ay.`; changes = apply({ happy: 8 }); if (o.id !== P.dream && !CAREERS[o.id].plain) text += ` (Xəyalın ${dreamName()} idi… həyat, sən nə qəribəsən!)`; } else { text = "Müsahibədən keçmədin. Sonra yenə yoxla."; changes = apply({ happy: -3 }); } }

    s.el.innerHTML = `<div class="big">💼</div><p class="q">${esc(text)}</p><div class="fx">${fxChips(changes)}</div><button class="btn close">Yaxşı</button>`;
    s.el.querySelector(".close").onclick = () => { s.close(); renderGame(); };
  });
}
let shopCat = "esya";
function shopPicker() {
  const loanOk = canLoan();
  const icon = it => ({ esya: "🛍️", masin: "🚗", menzil: "🏠", heyet: "🏡", bag: "🌳", torpaq: "🌾", magaza: "🏪" }[it.kind] || "📦");
  const s = sheet(`<div class="big">🔑</div><p class="q">Alış-veriş · Pulun: ${fmtMoney(P.money)}</p>
    <div class="seg" id="shopCats" style="display:flex;flex-wrap:wrap;margin-bottom:10px">${Object.entries(SHOP_CATS).map(([k, t]) => `<button data-c="${k}" aria-pressed="${k === shopCat}" style="flex:1">${t}</button>`).join("")}</div>
    <div class="choices" id="shopList"></div>
    ${P.assets.length ? `<p class="sec-h">Əmlakın</p><div class="choices">${P.assets.map((a, i) => `<button data-sell="${i}">💱 Sat: ${esc(a.t)} · ${fmtMoney(a.value)}</button>`).join("")}</div>` : ""}
    ${(P.loans || []).length ? `<p class="small muted">Kreditlər: ${P.loans.map(l => `${esc(l.t)} — qalıq ${fmtMoney(l.left)}, ildə ${fmtMoney(l.yearly)}`).join("; ")}</p>` : ""}
    <p class="small muted">Kredit: ${Math.round(LOAN.down * 100)}% ilkin ödəniş, illik ${Math.round(LOAN.rate * 100)}%, illik ödəniş maaşın 40%-dən çox ola bilməz (sadələşdirilmiş bank şərtləri). ${loanOk ? "" : "Kredit üçün 21+ yaş və işin olmalıdır."}</p>
    <button class="btn ghost close">Bağla</button>`);
  s.el.querySelector(".close").onclick = s.close;
  const draw = () => {
    s.el.querySelectorAll("#shopCats button").forEach(b => b.setAttribute("aria-pressed", b.dataset.c === shopCat));
    s.el.querySelector("#shopList").innerHTML = SHOP.filter(it => it.cat === shopCat).map(it => {
      const cash = P.money >= it.price, creditable = it.cat !== "esya" && it.price >= 5000 && loanOk && P.money >= it.price * LOAN.down;
      const credit = creditable && loanAffordable(it), yearly = annuity(it.price * (1 - LOAN.down), LOAN.rate, LOAN.years[it.cat] || 10);
      return `<div style="display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center"><button data-id="${it.id}" ${cash ? "" : "disabled style='opacity:.45'"}>${icon(it)} ${esc(it.t)} · ${fmtMoney(it.price)}</button>${credit ? `<button data-credit="${it.id}" class="btn ghost" style="padding:10px;font-size:12.5px">Kreditlə<br>${fmtMoney(Math.round(it.price * LOAN.down))}</button>` : creditable ? `<span class="small muted" style="max-width:90px;text-align:center">Gəlir az: ildə ${fmtMoney(yearly)} ödəniş</span>` : ""}</div>`;
    }).join("");
    s.el.querySelectorAll("[data-id]").forEach(b => b.onclick = () => buy(b.dataset.id, false));
    s.el.querySelectorAll("[data-credit]").forEach(b => b.onclick = () => buy(b.dataset.credit, true));
  };
  const buy = (id, credit) => {
    const it = SHOP.find(x => x.id === id); if (!credit && P.money < it.price) return; if (!useAct()) return;
    const before = P.money, ch = buyItem(it, credit);
    const loan = credit ? P.loans[P.loans.length - 1] : null;
    log(`${icon(it)} ${it.t} aldı${credit ? " (kreditlə)" : ""}!`); save();
    s.el.innerHTML = `<div class="big">${icon(it)}</div><p class="q">Təbriklər! ${esc(it.t)} artıq sənindir.${loan ? ` Kredit: ${loan.years} il, ildə ${fmtMoney(loan.yearly)}.` : ""}</p><div class="fx">${fxChips([["money", P.money - before], ...ch])}</div><button class="btn close">Yaxşı</button>`;
    s.el.querySelector(".close").onclick = () => { s.close(); renderGame(); };
  };
  s.el.querySelectorAll("#shopCats button").forEach(b => b.onclick = () => { shopCat = b.dataset.c; draw(); });
  s.el.querySelectorAll("[data-sell]").forEach(b => b.onclick = () => {
    const a = P.assets[+b.dataset.sell]; P.assets.splice(+b.dataset.sell, 1); P.money += a.value;
    const li = (P.loans || []).findIndex(l => l.t === a.t); if (li >= 0) { P.money -= P.loans[li].left; log(`🏦 Satışdan kredit qalığı ödəndi: ${fmtMoney(P.loans[li].left)}.`); P.loans.splice(li, 1); }
    log(`💱 ${a.t} satıldı: ${fmtMoney(a.value)}.`); save(); s.close(); renderGame(); toast("Satıldı: +" + fmtMoney(a.value));
  });
  draw();
}
function findLove() {
  if (!useAct()) return;
  const ok = chance(.25 + P.st.looks / 220 + P.tal.social / 450 + (P.fame / 300));
  let text, ch;
  if (ok) { const g = P.g === "k" ? "q" : "k"; const s = addPerson("sevgili", g, Math.max(16, P.age + rnd(-4, 3))); text = pick([`Dostunun ad günündə ${s.name} ilə tanış oldun. Gecə boyu danışdınız 💕`, `Tanışlıq tətbiqində ${s.name} ilə yazışdınız, sonra görüşdünüz. Qığılcım var! ✨`, `${s.name} ilə kitab mağazasında eyni kitaba əl uzatdınız 📚💘`]); ch = apply({ happy: 10 }); }
  else { text = pick(["Görüşə getdin, amma heç bir qığılcım olmadı.", "Mesajını “görüldü” edib cavab vermədi 😶", "Görüş zamanı yalnız öz keçmiş sevgilisindən danışdı…"]); ch = apply({ happy: -3 }); }
  log("💘 " + text); save();
  const s = sheet(`<div class="big">💘</div><p class="q">${esc(text)}</p><div class="fx">${fxChips(ch)}</div><button class="btn close">Yaxşı</button>`);
  s.el.querySelector(".close").onclick = () => { s.close(); renderGame(); };
}

const ORDER = ["həyat yoldaşı", "sevgili", "uşaq", "nəvə", "ana", "ata", "qardaş", "bacı", "dost", "müəllim", "məşqçi"];
function panelPpl() {
  const live = P.people.filter(p => !p.role.startsWith("keçmiş")).sort((a, b) => (ORDER.indexOf(a.role) + 99 * !a.alive) - (ORDER.indexOf(b.role) + 99 * !b.alive));
  const past = P.people.filter(p => p.role.startsWith("keçmiş") && p.alive && ["keçmiş sevgili", "keçmiş dost"].includes(p.role));
  const row = p => `<button class="pp ${p.alive ? "" : "dead"}" data-id="${p.id}"><span class="e" aria-hidden="true">${p.alive ? (ROLE_ICON[p.role] || avatar(p)) : "🕯️"}</span><span><div class="nm">${esc(p.name)}</div><div class="rl">${esc(p.role)} · ${p.alive ? p.age + " yaş" : "rəhmətə gedib"}${p.job ? " · " + esc(p.job) : ""}${p.note ? " · " + esc(p.note) : ""}</div></span>${p.alive ? `<span class="relbar" title="Münasibət ${p.rel}%"><i style="width:${p.rel}%"></i></span>` : ""}</button>`;
  $("#panel").innerHTML = `<div class="ppl">${live.map(row).join("")}</div>${past.length ? `<p class="sec-h">Keçmiş</p><div class="ppl">${past.map(row).join("")}</div>` : ""}`;
  $("#panel").querySelectorAll(".pp").forEach(b => b.onclick = () => personSheet(P.people.find(p => p.id === b.dataset.id)));
}
function personSheet(p) {
  if (!p.alive) return toast(`${p.name} — Allah rəhmət eləsin.`);
  const opts = [{ id: "talk", t: "💬 Söhbət et" }, { id: "gift", t: "🎁 Hədiyyə al (50 ₼)", cost: 50 }];
  if (p.role === "sevgili" && P.age >= 18 && p.rel >= 60) opts.push({ id: "propose", t: "💍 Evlilik təklif et" });
  if (p.role === "sevgili") opts.push({ id: "breakup", t: "💔 Ayrıl" });
  if (p.role === "həyat yoldaşı") opts.push({ id: "divorce", t: "📄 Boşan" });
  if (POCKET_MAX[p.role] && P.age < 18) opts.push({ id: "money", t: `🙏 Cib xərcliyi istə (ən çox ${POCKET_MAX[p.role]} ₼)` });
  if (p.role === "həyat yoldaşı" && people("uşaq").length < 4 && P.age < 48) opts.push({ id: "baby", t: "👶 Uşaq istəyirik" });
  const s = sheet(`<div class="big">${ROLE_ICON[p.role] || avatar(p)}</div><p class="q">${esc(p.name)} <span class="muted">· ${esc(p.role)}, ${p.age} yaş</span><br><span class="small muted">Münasibət: ${p.rel}%</span></p><div class="choices">${opts.map(o => `<button data-id="${o.id}" ${o.cost && P.money < o.cost ? "disabled style='opacity:.45'" : ""}>${o.t}</button>`).join("")}</div><button class="btn ghost close">Bağla</button>`);
  s.el.querySelector(".close").onclick = s.close;
  s.el.querySelectorAll(".choices button").forEach(b => b.onclick = () => {
    if (!useAct()) return;
    let text, ch = [];
    const id = b.dataset.id;
    if (id === "talk") { p.rel = clamp(p.rel + rnd(4, 9)); ch = apply({ happy: 2 }); text = pick([`${p.name} ilə uzun-uzun söhbət etdiniz.`, `${p.name} sənə həyatından maraqlı bir əhvalat danışdı.`, `${p.name} ilə köhnə xatirələri yada saldınız, çox güldünüz.`]); }
    if (id === "gift") { P.money -= 50; ch = [["money", -50]]; p.rel = clamp(p.rel + rnd(8, 14)); text = `${p.name} hədiyyəni çox bəyəndi!`; }
    if (id === "propose") { if (chance(p.rel / 110)) { p.role = "həyat yoldaşı"; P.flags.evli = P.age; P.money -= 5000; ch = [["money", -5000], ...apply({ happy: 18 })]; text = `“Hə!” dedi! 💍 Toy edildi, ${p.name} artıq həyat yoldaşındır.`; } else { p.rel = clamp(p.rel - 15); ch = apply({ happy: -12 }); text = `${p.name} “hələ hazır deyiləm” dedi…`; } }
    if (id === "breakup") { p.role = "keçmiş sevgili"; ch = apply({ happy: -6 }); text = `${p.name} ilə ayrıldınız.`; }
    if (id === "divorce") { p.role = "keçmiş həyat yoldaşı"; const half = Math.max(0, Math.round(P.money / 2)); P.money -= half; ch = [["money", -half], ...apply({ happy: -15 })]; text = `Boşandınız. Əmlak bölündü.`; }
    if (id === "money") {
      // family means (parents' jobs) + relationship decide; grandparents are a bit more generous
      const max = POCKET_MAX[p.role], means = familyMeans();
      const ok = chance(clamp(p.rel / 140 + means / 15 + (max > 10 ? 0.15 : 0), 0.1, 0.92));
      if (ok) { const m = Math.max(1, Math.min(max, Math.round(rnd(1, max) * (0.6 + means / 10)))); P.money += m; ch = [["money", m]]; text = max > 10 ? `${p.name} gizlicə cibinə ${m} ₼ qoydu: “Anana demə.”` : `${p.name} sənə ${m} ₼ verdi. “Bax ha, dondurmaya xərcləmə!”`; }
      else { text = max > 10 ? `${p.name} başını sığalladı: “Pensiyam gələndə, bala. Get, sənə çay süzüm.”` : means <= 1 ? `${p.name} köks ötürdü: “Bu ay pul çox azdır, bala.”` : `${p.name}: “Pul ağacda bitmir!”`; }
    }
    if (id === "baby") { if (chance(.6)) { const g = pick(["k", "q"]); const k = addPerson("uşaq", g, 0, { last: surname(P.fam, g) }); P.stats.kids++; P.pendingName = k.id; ch = apply({ happy: 15, money: -1500 }); text = `${g === "k" ? "Oğlunuz" : "Qızınız"} oldu! Adını ${k.name} qoydunuz 🍼`; } else { text = "Bu il alınmadı. Səbr…"; } }
    log("💬 " + text); save();
    const show = () => { s.el.innerHTML = `<div class="big">${ROLE_ICON[p.role] || "🙂"}</div><p class="q">${esc(text)}</p><div class="fx">${fxChips(ch)}</div><button class="btn close">Yaxşı</button>`;
      s.el.querySelector(".close").onclick = () => { s.close(); renderGame(); }; };
    if (P.pendingName) nameForm(s.el, (old, name) => { if (old) text = text.split(old).join(name); show(); }); else show();
  });
}

    <div style="display:grid;gap:8px;margin-top:18px"><button class="btn ghost" id="home">🏠 Əsas menyu</button><button class="btn ghost" id="quit" style="color:var(--bad)">Bu həyatı bitir</button></div>`;
  $("#home").onclick = async () => { await DB.saveLife(P, true); P = null; renderStart(); };
  $("#quit").onclick = () => { if (confirm("Bu həyat bitsin? Geri qaytarmaq olmayacaq.")) { die("oyunçu bitirdi"); renderEnd(); } };
}

// ---------- end ----------
function renderEnd() {
  const s = lifeSummary();
  const same = s.becameId === P.dream;
  const lines = [];
  lines.push(`${P.age} yaş yaşadı`);
  app.innerHTML = `<section class="wrap end" style="padding-block:calc(30px + env(safe-area-inset-top)) 40px">
    <div class="big" aria-hidden="true">🕊️</div><h2>${esc(s.name)}</h2><p class="muted" style="margin:0">${Cal.fmt(P.birth)} – ${Cal.fmt(P.deathDay || P.day)} · ${P.age} yaş · ${esc(P.city)}</p>
    <div class="vs"><div><small>Xəyal</small>${esc(s.dream || "?")}</div><span style="font-size:22px">→</span><div><small>Oldu</small>${esc(s.became)}</div></div>
    <p class="motto">${same ? "Xəyalını gerçəkləşdirdi! 🌟" : "Həyat, sən nə qəribəsən!"}</p>
    ${P.cause ? `<p class="muted" style="margin:-6px 0 14px">Ölüm səbəbi: ${esc(P.cause)}</p>` : ""}
    <div class="grid2"><div><span class="muted small">Sərvət</span><b>${fmtMoney(s.money)}</b></div><div><span class="muted small">İzləyici</span><b>${fmtNum(s.followers)}</b></div>
      <div><span class="muted small">Ailə</span><b>${s.married ? "Evli" : "Subay"} · ${s.kids} uşaq</b></div><div><span class="muted small">Şöhrət</span><b>⭐ ${P.fame}</b></div>
      <div><span class="muted small">Səyahət</span><b>${P.stats.countries} dəfə</b></div><div><span class="muted small">Paylaşım</span><b>${P.stats.posts}</b></div></div>
    ${(() => { const sv = survivors(); return `<div class="card" style="text-align:left;margin-bottom:12px"><h3 style="font-size:18px;margin-bottom:8px">Geridə qalanlar</h3>${sv.now.map(t => `<p style="margin:6px 0">${esc(t)}</p>`).join("")}${sv.before.length ? `<p class="small muted" style="margin:10px 0 4px">Ondan əvvəl getdilər:</p>${sv.before.map(t => `<p class="small muted" style="margin:2px 0">${esc(t)}</p>`).join("")}` : ""}</div>`; })()}
    ${(P.careerHist || []).length ? `<div class="card small" style="text-align:left;margin-bottom:12px"><h3 style="font-size:16px;margin-bottom:6px">Karyera yolu</h3>${P.careerHist.filter(h => h.kind !== "end").slice(-8).map(h => `<div>${h.age} yaş · ${esc(h.text)}</div>`).join("")}</div>` : ""}
    <button class="btn" id="again" style="width:100%">Yeni həyat başlat 🌱</button>
    <button class="btn ghost" id="story" style="width:100%;margin-top:8px">Həyat hekayəsinə bax</button></section>`;
  $("#again").onclick = () => { P.endSeen = true; save(true); renderCreate(); };
  $("#story").onclick = () => { const x = sheet(`<h3 style="margin-bottom:10px">Həyat hekayəsi</h3>${P.log.map(y => `<div class="yr"><h3>${y.age} yaş</h3>${y.items.map(t => `<p>${esc(t)}</p>`).join("")}</div>`).join("")}<button class="btn close">Bağla</button>`); x.el.querySelector(".close").onclick = x.close; };
}

// ---------- boot ----------
// ---------- boot: content library, rules, database ----------
const EVENT_FILES = ["data/events/core_5_17.json", "data/events/core_18_plus.json", "data/events/pack_v1.json", "data/events/arcs_5_18.json", "data/events/paths.json"];
(async function boot() {
  app.innerHTML = '<p class="wrap muted" style="padding-top:40vh;text-align:center">Yüklənir…</p>';
  try {
    const [rules, careers, ...lists] = await Promise.all(["data/rules.json", "data/careers.json", ...EVENT_FILES].map(f => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); })));
    RULES = rules; loadCareers(careers); Interp.load(lists);
    const errs = Interp.validate(lists); if (errs.length) console.warn("Hadisə kitabxanasında xəta:", errs);
    await DB.open();
    const imported = await DB.importLegacy(migrateLife);
    const active = imported || await DB.getMeta("active");
    if (active) { await loadLife(active); if (P && P.alive) { renderGame(); return; } if (P && !P.endSeen) { renderEnd(); return; } P = null; }
    renderStart();
  } catch (err) { app.innerHTML = `<div class="wrap" style="padding-top:30vh;text-align:center"><p>Oyun yüklənmədi.</p><p class="small muted">${esc(err.message)}</p><button class="btn" onclick="location.reload()">Yenidən yoxla</button></div>`; }
})();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
